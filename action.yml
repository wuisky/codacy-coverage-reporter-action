# action.yml
name: 'Codacy Coverage Reporter'
description: 'Multi-language coverage reporter for Codacy'
branding:
  icon: 'check'
  color: 'gray-dark'
inputs:
  project-token:
    required: false
    description: "API project token to authenticate on the Codacy API while uploading the coverage data"
  api-token:
    required: false
    description: "API account token to authenticate on the Codacy API while uploading the coverage data"
  coverage-reports:
    description: 'Optional comma separated list of coverage reports to send to Codacy'
    required: false
    default: ''
  language:
    description: 'Optionally force associating a language with your coverage report'
    required: false
  force-coverage-parser:
    description: 'Optionally force using a specific coverage report parser'
    required: false
  coverage-reporter-version:
    description: 'Optionally force using a specific coverage reporter version'
    required: false
  http-proxy:
    description: 'HTTP proxy URL (e.g., http://proxy.example.com:8080)'
    required: false
  https-proxy:
    description: 'HTTPS proxy URL (e.g., http://proxy.example.com:8080)'
    required: false
  no-proxy:
    description: 'Comma-separated list of hosts that should not use proxy'
    required: false
runs:
  using: "composite"
  steps:
    - name: "Set Repository Variables"
      shell: bash
      run: |
        echo "ORGANIZATION_PROVIDER=$(if [[ $GITHUB_SERVER_URL == "https://github.com" ]]; then echo "gh"; else echo "ghe"; fi)" >> $GITHUB_ENV
        echo "OWNER_NAME=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 1)" >> $GITHUB_ENV
        echo "REPOSITORY_NAME=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 2)" >> $GITHUB_ENV
        echo "CODACY_REPORTER_VERSION=$(if [ -n "${{ inputs.coverage-reporter-version }}" ]; then echo "${{ inputs.coverage-reporter-version }}"; fi)" >> $GITHUB_ENV

        # Set proxy environment variables if provided
        if [ -n "${{ inputs.http-proxy }}" ]; then
          echo "HTTP_PROXY=${{ inputs.http-proxy }}" >> $GITHUB_ENV
          echo "http_proxy=${{ inputs.http-proxy }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ inputs.https-proxy }}" ]; then
          echo "HTTPS_PROXY=${{ inputs.https-proxy }}" >> $GITHUB_ENV
          echo "https_proxy=${{ inputs.https-proxy }}" >> $GITHUB_ENV
        fi
        if [ -n "${{ inputs.no-proxy }}" ]; then
          echo "NO_PROXY=${{ inputs.no-proxy }}" >> $GITHUB_ENV
          echo "no_proxy=${{ inputs.no-proxy }}" >> $GITHUB_ENV
        fi

        # Set Java proxy options for Codacy Coverage Reporter
        java_proxy_opts=""
        if [ -n "${{ inputs.http-proxy }}" ]; then
          proxy_host=$(echo "${{ inputs.http-proxy }}" | sed -E 's|^https?://([^:/]+).*|\1|')
          proxy_port=$(echo "${{ inputs.http-proxy }}" | sed -E 's|^https?://[^:]+:([0-9]+).*|\1|')
          if [ -z "$proxy_port" ] || [ "$proxy_port" = "${{ inputs.http-proxy }}" ]; then proxy_port="80"; fi
          java_proxy_opts="$java_proxy_opts -Dhttp.proxyHost=$proxy_host -Dhttp.proxyPort=$proxy_port"
        fi
        if [ -n "${{ inputs.https-proxy }}" ]; then
          proxy_host=$(echo "${{ inputs.https-proxy }}" | sed -E 's|^https?://([^:/]+).*|\1|')
          proxy_port=$(echo "${{ inputs.https-proxy }}" | sed -E 's|^https?://[^:]+:([0-9]+).*|\1|')
          if [ -z "$proxy_port" ] || [ "$proxy_port" = "${{ inputs.https-proxy }}" ]; then proxy_port="443"; fi
          java_proxy_opts="$java_proxy_opts -Dhttps.proxyHost=$proxy_host -Dhttps.proxyPort=$proxy_port"
        fi
        if [ -n "${{ inputs.no-proxy }}" ]; then
          no_proxy_hosts=$(echo "${{ inputs.no-proxy }}" | tr ',' '|')
          java_proxy_opts="$java_proxy_opts -Dhttp.nonProxyHosts=$no_proxy_hosts"
        fi
        echo "JAVA_TOOL_OPTIONS=$java_proxy_opts" >> $GITHUB_ENV

    - name: "Run coverage-reporter"
      shell: bash
      run: |
        echo "Welcome to Coverage-Reporter-Action yoyo"

        set -eux

        # Set Java proxy options if provided
        java_proxy_opts=""
        if [ -n "${{ inputs.http-proxy }}" ]; then
          proxy_host=$(echo "${{ inputs.http-proxy }}" | sed -E 's|^https?://([^:/]+).*|\1|')
          proxy_port=$(echo "${{ inputs.http-proxy }}" | sed -E 's|^https?://[^:]+:([0-9]+).*|\1|')
          if [ -z "$proxy_port" ] || [ "$proxy_port" = "${{ inputs.http-proxy}}" ]; then proxy_port="80"; fi
          java_proxy_opts="$java_proxy_opts -Dhttp.proxyHost=$proxy_host -Dhttp.proxyPort=$proxy_port"
          echo "HTTP proxy configured: $proxy_host:$proxy_port"
        fi
        if [ -n "${{ inputs.https-proxy }}" ]; then
          proxy_host=$(echo "${{ inputs.https-proxy }}" | sed -E 's|^https?://([^:/]+).*|\1|')
          proxy_port=$(echo "${{ inputs.https-proxy }}" | sed -E 's|^https?://[^:]+:([0-9]+).*|\1|')
          if [ -z "$proxy_port" ] || [ "$proxy_port" = "${{ inputs.https-proxy }}" ]; then proxy_port="443"; fi
          java_proxy_opts="$java_proxy_opts -Dhttps.proxyHost=$proxy_host -Dhttps.proxyPort=$proxy_port"
          echo "HTTPS proxy configured: $proxy_host:$proxy_port"
        fi
        if [ -n "${{ inputs.no-proxy }}" ]; then
          no_proxy_hosts=$(echo "${{ inputs.no-proxy }}" | tr ',' '|')
          java_proxy_opts="$java_proxy_opts -Dhttp.nonProxyHosts=$no_proxy_hosts"
          echo "No proxy hosts: $no_proxy_hosts"
        fi

        if [ -n "$java_proxy_opts" ]; then
          export JAVA_TOOL_OPTIONS="$java_proxy_opts"
          echo "JAVA_TOOL_OPTIONS set to: $JAVA_TOOL_OPTIONS"
        fi

        report_list=''
        # comma separated list of report files
        if [ -n "${{ inputs.coverage-reports }}" ]; then report_list="${{ inputs.coverage-reports }}"; fi

        IFS=','
        report_array=$report_list
        params=''
        for report in $report_array
        do
            if [ ! -z "$report" ]
            then
                params="$params -r $report"
            fi
        done

        auth=''
        if [ -n "${{ inputs.api-token }}" ]; then auth="--api-token ${{ inputs.api-token }} --organization-provider $ORGANIZATION_PROVIDER --username $OWNER_NAME --project-name $REPOSITORY_NAME"; fi
        if [ -n "${{ inputs.project-token }}" ]; then auth="--project-token ${{ inputs.project-token }}"; fi
        if [ -n "${{ inputs.force-coverage-parser }}" ]; then force_parser="--force-coverage-parser ${{ inputs.force-coverage-parser }}"; else force_parser=""; fi
        if [ -n "${{ inputs.language }}" ]; then lang="--language ${{ inputs.language }}"; else lang=""; fi

        # Download get.sh script
        curl -Ls https://coverage.codacy.com/get.sh -o /tmp/codacy-get.sh

        # Modify get.sh to inject Java proxy options directly into the java command
        if [ -n "$java_proxy_opts" ]; then
          echo "Modifying get.sh to inject Java proxy settings..."
          echo "Proxy options to inject: $java_proxy_opts"

          # Line 227 contains: run_command="java -jar \"$reporter_path\""
          # We need to inject proxy options between 'java' and '-jar'
          sed -i "227s|java -jar|java $java_proxy_opts -jar|" /tmp/codacy-get.sh

          echo "Modified java command in get.sh:"
          sed -n '227p' /tmp/codacy-get.sh
        fi

        chmod +x /tmp/codacy-get.sh

        # Execute the modified script
        bash /tmp/codacy-get.sh report $lang $force_parser $auth $params --partial &&\
        bash /tmp/codacy-get.sh final $auth
